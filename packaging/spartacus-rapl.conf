# Make CPU package energy (RAPL) readable so spartacus-daemon can compute
# CPU wattage without root. Install with:
#   sudo cp packaging/spartacus-rapl.conf /etc/tmpfiles.d/ && sudo systemd-tmpfiles --create
z /sys/class/powercap/intel-rapl:0/energy_uj 0444 root root -
z /sys/class/powercap/intel-rapl:0:0/energy_uj 0444 root root -
