<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     viewBox="0 0 512 512">
  <metadata>
    <rdf:RDF>
      <rdf:Description rdf:about="">
        <dc:title>Spartacus Control Center</dc:title>
        <dc:creator>nerdjb (https://github.com/nerdjb)</dc:creator>
        <dc:description>Application icon for the Spartacus Control Center — Linux control suite for DeepCool SPARTACUS AIO coolers.</dc:description>
        <dc:rights>MIT / GPL v3</dc:rights>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131a36"/>
      <stop offset="100%" stop-color="#0a0e22"/>
    </linearGradient>
    <radialGradient id="hub" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#8ff7ff"/>
      <stop offset="45%" stop-color="#00c8ff"/>
      <stop offset="100%" stop-color="#0b3ea8"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- RGB ring segments, r=190, three 105-degree arcs -->
    <path id="seg-cyan"    d="M 289.0 68.9 A 190 190 0 0 1 428.2 336.3"/>
    <path id="seg-magenta" d="M 401.5 378.1 A 190 190 0 0 1 100.4 365.0"/>
    <path id="seg-violet"  d="M 77.5 321.0 A 190 190 0 0 1 239.4 66.7"/>

    <!-- Turbine blade arc, r=78, centered at 12 o'clock -->
    <path id="blade" d="M 231.9 181.8 A 78 78 0 0 1 280.1 181.8"/>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Ring track -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1d2648" stroke-width="26"/>

  <!-- RGB ring glow underlay -->
  <g filter="url(#softGlow)" opacity="0.55">
    <use href="#seg-cyan"    stroke="#00e5ff" stroke-width="26" fill="none" stroke-linecap="round"/>
    <use href="#seg-magenta" stroke="#ff2e88" stroke-width="26" fill="none" stroke-linecap="round"/>
    <use href="#seg-violet"  stroke="#7c4dff" stroke-width="26" fill="none" stroke-linecap="round"/>
  </g>

  <!-- RGB ring segments -->
  <g filter="url(#glow)">
    <use href="#seg-cyan"    stroke="#19e9ff" stroke-width="26" fill="none" stroke-linecap="round"/>
    <use href="#seg-magenta" stroke="#ff3f92" stroke-width="26" fill="none" stroke-linecap="round"/>
    <use href="#seg-violet"  stroke="#8a5cff" stroke-width="26" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Pump cap body -->
  <circle cx="256" cy="256" r="146" fill="#0e1530" stroke="#243158" stroke-width="3"/>
  <circle cx="256" cy="256" r="112" fill="#0a1026" stroke="#1c2950" stroke-width="2"/>

  <!-- Turbine blades -->
  <g stroke="#2c3d72" stroke-width="17" fill="none" stroke-linecap="round">
    <use href="#blade"/>
    <use href="#blade" transform="rotate(60 256 256)"/>
    <use href="#blade" transform="rotate(120 256 256)"/>
    <use href="#blade" transform="rotate(180 256 256)"/>
    <use href="#blade" transform="rotate(240 256 256)"/>
    <use href="#blade" transform="rotate(300 256 256)"/>
  </g>

  <!-- Hub -->
  <circle cx="256" cy="256" r="42" fill="url(#hub)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="42" fill="none" stroke="#9df6ff" stroke-width="2.5" opacity="0.9"/>
  <circle cx="256" cy="256" r="15" fill="#06101f"/>

  <!-- Wordmark -->
  <text x="256" y="497" text-anchor="middle"
        font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="bold"
        letter-spacing="7" fill="#9fb4d8">SPARTACUS</text>
</svg>
